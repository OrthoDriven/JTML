[package]
name = "direct-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
basin = { version = "1.7.0", features = ["nalgebra", "serde", "parallel", "nalgebra-lapack"] }
cxx.workspace = true
nalgebra = "0.35.0"
ordered-float = "5.5.0"

[build-dependencies]
cxx-build.workspace = true

[dev-dependencies]
proptest = "1.6"
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend",
"line_series", "point_series"] }

[lints]
workspace = true

[lib]
crate-type=["staticlib", "cdylib"]
